<!DOCTYPE html>
<html>
<head>
    <title>Responsive Course Cards</title>
    <style>
        .course-list {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .course-card {
            flex: 1 1 220px;
            border: 1px solid black;
            padding: 16px;
        }
    </style>
</head>
<body>
    <section class="course-list">
        <div class="course-card">Course 1</div>
        <div class="course-card">Course 2</div>
        <div class="course-card">Course 3</div>
        <div class="course-card">Course 4</div>
        <div class="course-card">Course 5</div>
        <div class="course-card">Course 6</div>
    </section>
</body>
</html>
